name: Build Docker Image
on:
  push:
    tags:
      - '*'
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      kernel:
        description: Kernel to build the images with (the mainline one is experimental)
        type: choice
        options:
          - vendor
          - mainline
        default: vendor

# a newer push to the same branch makes the older run obsolete (but never cancel a tag/release run)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # the exact image built for this commit, used by the build-image jobs below
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Work out the image name
        id: vars
        run: |
          # registry names have to be lowercase, but the repository name can contain upper case letters
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "image=${name}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log into registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-image:
    strategy:
      fail-fast: false
      matrix:
        boards: [licheervnano, duo256, duos]
        storage: [sd]
        include:
          - boards: duos
            storage: emmc
    runs-on: ubuntu-latest
    needs: build-docker-image
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Get Board Configs
        uses: actions/checkout@v4
      - name: Build Images
        uses: addnab/docker-run-action@v3
        with:
          # the image built from this very commit, so changes to the Dockerfile, Makefile and
          # scripts are what gets tested (only configs/ is mounted from the checkout)
          image: ${{ needs.build-docker-image.outputs.image }}
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          options: --privileged -v ${{ github.workspace }}/images/:/output -v ${{ github.workspace }}/configs/:/configs/
          run: |
            set -e
            make BOARD=${{ matrix.boards }} STORAGE_TYPE=${{ matrix.storage }} KERNEL=${{ inputs.kernel || 'vendor' }} image
            chmod 777 /output/
      - name: Pack
        run: |
          command -v lz4 >/dev/null || sudo apt-get install -y --no-install-recommends lz4
          cd images/
          ls -lah
          if [ -f ${{ matrix.boards }}_${{ matrix.storage }}.img ]; then
              lz4 -9 -f ${{ matrix.boards }}_${{ matrix.storage }}.img ${{ matrix.boards }}_${{ matrix.storage }}.img.lz4
              rm ${{ matrix.boards }}_${{ matrix.storage }}.img
          fi
          tar czvf ${{ matrix.boards }}-${{ matrix.storage }}_debs.tar.gz *.deb
          rm *.deb
          echo "PACKAGE=${{ github.workspace }}/images/*" >> $GITHUB_ENV
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: image-files-${{ matrix.boards }}-${{ matrix.storage }}${{ inputs.kernel == 'mainline' && '-mainline' || '' }}
          path: |
            ${{env.PACKAGE}}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      contents: write
    steps:
      - name: download firmware
        uses: actions/download-artifact@v4
      - name: list images
        run: |
          ls -lah
          ls -lah image-files-*/
      - name: publish artifacts
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          files: |
            image-files-*/*
